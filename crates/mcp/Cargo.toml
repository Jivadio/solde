[package]
name = "solde-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
solde-services = { path = "../services" }
# Trigger-only: the MCP server may start a sync and read its status, but it
# must never see credentials or challenges (enforced by check-deps).
solde-sync-facade = { path = "../sync-facade", features = ["trigger"] }

[lints]
workspace = true
