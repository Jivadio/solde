# SPDX-License-Identifier: AGPL-3.0-or-later
# release-please: maintains a release PR from Conventional Commits on main and
# tags the release when it is merged. Each release then publishes the server
# image to ghcr.io/jivadio/solde (<version> and latest), for linux/amd64 only
# for now. Multi-arch images, SBOM and desktop artefacts will be added in
# later milestones.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time, never cancelled halfway. GitHub keeps only one
# pending run per group: a newer push replaces a queued run, which is then
# dropped (the image job builds the tagged commit, not the triggering one).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The default GITHUB_TOKEN is not allowed to create pull requests in this
    # repository (on purpose). release-please runs with a short-lived token from
    # the repository's GitHub App instead, so the token below needs no rights.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      # Both the app's client ID (variable) and private key (secret) are needed.
      RELEASE_APP_CONFIGURED: ${{ vars.RELEASE_APP_CLIENT_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Skip when the release app is not configured
        if: env.RELEASE_APP_CONFIGURED != 'true'
        run: echo "::notice::RELEASE_APP_CLIENT_ID or RELEASE_APP_PRIVATE_KEY is not set; skipping release-please. See docs/README.md (For maintainers)."

      - name: Mint a GitHub App token
        id: app-token
        if: env.RELEASE_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Release PRs opened by the app are authored by a bot account, so the
      # required checks run on them and the DCO check skips them.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: env.RELEASE_APP_CONFIGURED == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when release-please has just tagged a release (the push that
  # merged the release PR). It builds the tagged commit, which may differ from
  # the commit that triggered this run when runs queue up.
  image:
    name: publish image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job with write access to packages: the default GITHUB_TOKEN
    # pushes the image to this repository's GitHub Container Registry. It gets
    # nothing else.
    permissions:
      contents: read
      packages: write # push ghcr.io/jivadio/solde
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      # A re-run of an older release job keeps its original outputs: it may
      # publish its version tag again, but must not move `latest` back.
      - name: Tag latest only for the newest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$newest" = "$TAG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the newest release ($newest): latest is left alone."
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jivadio/solde
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enabled }}
          labels: |
            org.opencontainers.image.title=solde
            org.opencontainers.image.description=Self-hosted household finance server
            org.opencontainers.image.source=https://github.com/Jivadio/solde
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # No build cache on purpose: a release image is built from scratch, so
      # nothing cached by another run can end up in it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
